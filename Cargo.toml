[package]
name = "expander"
version = "0.18.0"
edition = "2021"
description = "Linux desktop helper: text expander, OCR, offline voice typing (Danish/English) and read aloud"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rdev = "0.5"
enigo = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"
